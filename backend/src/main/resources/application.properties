server.port=8080
spring.application.name=AuthLab
spring.datasource.url=jdbc:h2:file:./data/authlab;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
# DEMONSTRATION LOCALE UNIQUEMENT: activer Secure avec HTTPS en production.
server.servlet.session.cookie.secure=false
server.error.include-message=never
app.security.password-blocklist=./config/common-passwords.txt
